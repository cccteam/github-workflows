# This workflow fixes known, fixable dependency vulnerabilities without a human in the loop.
#  1. A deterministic gate (no LLM) collects open Dependabot alerts and govulncheck findings and keeps
#     only those with a published fixed version. Nothing actionable: the run ends silently.
#  2. A script bumps only those packages to the minimum fixed version with go get and npm.
#  3. Deterministic guards check the result: only dependency files changed, no major version jump, the fixed
#     versions are reached and the code still builds.
#  4. All guards pass: a pull request is opened and auto-merge is enabled. A guard fails: the first-pass fix is
#     kept as a DRAFT pull request labelled needs-human, auto-merge stays off, and the problems are listed.
#     Slack is posted only after action was taken.
# Vulnerabilities with no published fix are never touched.
#
# See docs/vuln-autofix.md for the setup prerequisites (tokens, branch protection) and a caller example.
#
# NOTE: This workflow has required secrets. Refer to the 'inputs' & 'secrets' sections below.
name: Vulnerability Autofix Template

on:
  workflow_call:
    inputs:
      auto-merge:
        required: false
        type: boolean
        default: true
        description: Enable auto-merge (squash) on the pull request so it merges once the required checks pass
      pr-labels:
        required: false
        type: string
        default: 'dependencies,security'
        description: Comma-separated labels for the pull request (created if missing)
      needs-human-label:
        required: false
        type: string
        default: 'needs-human'
        description: Label for the draft pull request opened when a guard failed and more work is needed (created if missing)
      go-private:
        required: false
        type: string
        default: ''
        description: GOPRIVATE value for private Go modules, e.g. 'github.com/my-org/*'. Needs the GO_PRIVATE_MODULES_TOKEN secret.
      govulncheck-version:
        required: false
        type: string
        default: 'v1.9.0'
        description: Version of govulncheck to use
      slack-channel-id:
        required: false
        type: string
        description: Overrides secrets.SLACK_CHANNEL_ID as the channel ID for notifications
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'

    secrets:
      DEPENDABOT_ALERTS_TOKEN:
        required: true
        description: Token that can read Dependabot alerts (GITHUB_TOKEN cannot). The same secret golang-security-scan uses.
      AUTOFIX_APP_CLIENT_ID:
        required: true
        description: Client ID of the GitHub App that pushes the branch and opens the pull request. A pull request opened with GITHUB_TOKEN does not trigger workflows, so its checks would never run. The app needs Contents and Pull requests write access on the repository.
      AUTOFIX_APP_PEM:
        required: true
        description: Private key of that GitHub App
      GO_PRIVATE_MODULES_TOKEN:
        required: false
        description: Read-only token that can clone the private Go modules named by the 'go-private' input. It must not have write access.
      SLACK_BOT_TOKEN:
        required: true
        description: Token for sending Slack notifications
      SLACK_CHANNEL_ID:
        required: true
        description: Channel ID for Slack notifications. This can be overridden by the 'slack-channel-id' input.

permissions: {}

concurrency:
  group: vuln-autofix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Vulnerability Autofix
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    # Read only: everything that writes uses a GitHub App token created after the bump and the checks have
    # finished, so no token that can write exists while go and npm run.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      # One branch and one pull request. Each run that has a fix replaces the branch and updates the pull request.
      BRANCH: vuln-autofix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # setup-go sets GOTOOLCHAIN=local. A standard library fix raises the go directive above the Go that was
      # set up, and the go command then refuses to run unless it may download the newer toolchain.
      - name: Let go download a newer toolchain
        if: hashFiles('go.mod') != ''
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      # ---- Step A: deterministic gate -------------------------------------------------------------------------

      - name: Collect Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPO}/dependabot/alerts?state=open&per_page=100" | jq -s 'add // []' > "$RUNNER_TEMP/dependabot-alerts.json"

      - name: Run govulncheck
        if: hashFiles('go.mod') != ''
        env:
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
          # Credentials for private Go modules, only when GO_PRIVATE_MODULES_TOKEN is set. They are passed as
          # environment variables to the steps that download modules, and are never written to a file.
          GOPRIVATE: ${{ inputs.go-private }}
          GIT_CONFIG_COUNT: ${{ secrets.GO_PRIVATE_MODULES_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GO_PRIVATE_MODULES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -format json ./... > "$RUNNER_TEMP/govulncheck.json"

      - name: Select actionable vulnerabilities
        id: gate
        run: |
          touch "$RUNNER_TEMP/govulncheck.json"
          ecosystems=()
          [[ -f go.mod ]] && ecosystems+=(go)
          [[ -f package-lock.json ]] && ecosystems+=(npm)
          ecosystems_json=$(jq -nc '$ARGS.positional' --args "${ecosystems[@]}")

          # Actionable means a published fixed version exists. Unfixed vulnerabilities never make the list.
          # Only a Dependabot alert's package name, versions and advisory IDs are used, and only when they match a
          # strict character set, because they become arguments of go and npm commands.
          cat > "$RUNNER_TEMP/gate.jq" <<'JQ'
          def rank: ({"critical": 4, "high": 3, "medium": 2, "moderate": 2, "low": 1}[ascii_downcase] // 0);
          def vkey: [scan("[0-9]+") | tonumber];
          def maxver: sort_by(vkey) | last;
          def ok_name: type == "string" and test("^[A-Za-z0-9@/._~+-]+$");
          def ok_ver: type == "string" and test("^v?[0-9][0-9A-Za-z.+-]*$");
          def ok_id: type == "string" and test("^[A-Za-z0-9-]+$");

          # Only the manifests at the repository root are fixed here, so an alert for a manifest in a
          # subdirectory is left alone. An alert without a manifest path is kept.
          def root_manifest: . == null or test("^(go\\.mod|go\\.sum|package\\.json|package-lock\\.json)$");

          ($alerts[0] // []
            | map(select(.security_vulnerability.first_patched_version.identifier != null
                         and (.dependency.package.ecosystem as $e | $ecosystems | index($e))
                         and (.dependency.manifest_path | root_manifest))
                  | {source: "dependabot",
                     ecosystem: .dependency.package.ecosystem,
                     package: .dependency.package.name,
                     ids: ([.security_advisory.ghsa_id, .security_advisory.cve_id] | map(select(. != null))),
                     severity: ((.security_advisory.severity // "unknown") | ascii_downcase),
                     # Go versions carry a leading v, which Dependabot leaves off
                     fixed: (.dependency.package.ecosystem as $e | .security_vulnerability.first_patched_version.identifier
                             | if $e == "go" and (startswith("v") | not) then "v" + . else . end)})) as $dependabot
          | ($govulncheck | map(select(.osv) | .osv) | INDEX(.id)) as $osv
          # A finding with a function in its trace is a vulnerable symbol the code calls (what govulncheck's text
          # mode reports). It needs a fixed_version to be actionable.
          | ($govulncheck | map(select(.finding) | .finding) | group_by([.osv, .trace[0].module])
              | map(select(any(.[]; .trace[0].function != null) and (.[0].fixed_version // "") != "")
                    | .[0] as $f
                    | {source: "govulncheck",
                       ecosystem: (if $f.trace[0].module == "stdlib" then "go-stdlib" else "go" end),
                       package: $f.trace[0].module,
                       ids: (([$f.osv] + ($osv[$f.osv].aliases // []))
                             | map(select(startswith("CVE-") or startswith("GHSA-") or startswith("GO-")))),
                       severity: "unknown",
                       fixed: $f.fixed_version})) as $go
          | ($dependabot + $go)
          | map(select((.package | ok_name) and (.fixed | ok_ver) and (.ids | all(ok_id))))
          | group_by([.ecosystem, .package])
          | map({ecosystem: .[0].ecosystem,
                 package: .[0].package,
                 ids: (map(.ids[]) | unique),
                 severity: (map(.severity) | max_by(rank)),
                 fixed: (map(.fixed) | maxver),
                 sources: (map(.source) | unique)})
          | sort_by(-(.severity | rank))
          JQ

          jq -n --slurpfile alerts "$RUNNER_TEMP/dependabot-alerts.json" \
                --slurpfile govulncheck "$RUNNER_TEMP/govulncheck.json" \
                --argjson ecosystems "$ecosystems_json" \
                -f "$RUNNER_TEMP/gate.jq" > "$RUNNER_TEMP/actionable.json"

          count=$(jq length "$RUNNER_TEMP/actionable.json")
          top=$(jq -r 'map(.severity) | if length == 0 then "none" elif index("critical") then "critical" elif index("high") then "high" elif index("medium") then "medium" elif index("low") then "low" else "unknown" end' "$RUNNER_TEMP/actionable.json")
          jq -r '.[] | "- [\(.severity | ascii_upcase)] \(.ids | join(", ")) `\(.package)` (fix: \(.fixed))"' "$RUNNER_TEMP/actionable.json" > "$RUNNER_TEMP/targets.md"

          {
            echo "count=$count"
            echo "top-severity=$top"
          } >> "$GITHUB_OUTPUT"
          echo "Actionable vulnerabilities: $count"
          cat "$RUNNER_TEMP/targets.md"

      # ---- Step B: fix ----------------------------------------------------------------------------------------

      - name: Bump the packages to their fixed versions
        id: fix
        if: steps.gate.outputs.count != '0'
        env:
          GOPRIVATE: ${{ inputs.go-private }}
          GIT_CONFIG_COUNT: ${{ secrets.GO_PRIVATE_MODULES_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GO_PRIVATE_MODULES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          # bump ECOSYSTEM PACKAGE FIXED: raises one package to its minimum fixed version. npm changes only
          # package.json and the lock file: nothing is installed, so no package install script runs.
          bump() {
            case "$1" in
              go) go get "$2@$3" && go mod tidy ;;
              go-stdlib) go get "go@${3#v}" && go mod tidy ;;
              npm)
                if jq -e --arg p "$2" '[.dependencies, .devDependencies, .optionalDependencies | objects | has($p)] | any' package.json > /dev/null; then
                  npm install "$2@$3" --package-lock-only --ignore-scripts
                else
                  npm update "$2" --package-lock-only --ignore-scripts
                fi ;;
            esac
          }

          while IFS=$'\t' read -r -u 3 eco pkg fixed; do
            echo "::group::$pkg to $fixed"
            if ! bump "$eco" "$pkg" "$fixed"; then
              echo "The version bump of $pkg to $fixed failed (see the run log)." >> "$RUNNER_TEMP/problems.txt"
            fi
            echo "::endgroup::"
          done 3< <(jq -r '.[] | [.ecosystem, .package, .fixed] | @tsv' "$RUNNER_TEMP/actionable.json")

      # ---- Step C: checks --------------------------------------------------------------------------------

      - name: Check the diff
        id: guard
        if: steps.gate.outputs.count != '0'
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          # A failed check is recorded, not fatal: the first-pass fix is kept and reviewed by a human
          problem() {
            echo "$1" >> "$RUNNER_TEMP/problems.txt"
            echo "::warning::$1"
          }

          # Only the dependency files at the repository root may change
          allowed='^(go\.mod|go\.sum|go\.work|go\.work\.sum|package\.json|package-lock\.json)$'
          git add -A

          mapfile -d '' -t files < <(git diff --cached --name-only -z)
          if [[ ${#files[@]} -eq 0 ]]; then
            problem "The version bump produced no change, although a fix is published."
            echo "has-diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          disallowed=()
          for f in "${files[@]}"; do
            [[ "$f" =~ $allowed ]] || disallowed+=("$f")
          done
          if [[ ${#disallowed[@]} -gt 0 ]]; then
            problem "The change touched files outside the allowed dependency files (review them): ${disallowed[*]}"
          fi

          # Dependency version changes: "name old new", where '-' is absent
          go_deps() {
            awk '/^require[[:space:]]*\(/ {b=1; next}
                 b && /^\)/ {b=0; next}
                 b && $1 !~ /^\/\// {print $1, $2; next}
                 /^require[[:space:]]+[^(]/ {print $2, $3}'
          }
          npm_deps() {
            jq -r '(.packages // {}) | to_entries[] | select(.key != "" and .value.version != null) | "\(.key) \(.value.version)"'
          }
          compare() {
            awk 'FILENAME == ARGV[1] {o[$1] = $2; next}
                 {n[$1] = $2}
                 END {for (k in n) { if (!(k in o)) print k, "-", n[k]; else if (o[k] != n[k]) print k, o[k], n[k] }
                      for (k in o) if (!(k in n)) print k, o[k], "-"}' "$1" "$2" | sort
          }
          : > "$RUNNER_TEMP/changes.txt"
          for spec in "go.mod:go_deps" "package-lock.json:npm_deps"; do
            file=${spec%%:*}
            parser=${spec##*:}
            [[ -f "$file" ]] || continue
            git show "$BASE_SHA:$file" 2>/dev/null | "$parser" > "$RUNNER_TEMP/old.txt" || : > "$RUNNER_TEMP/old.txt"
            "$parser" < "$file" > "$RUNNER_TEMP/new.txt"
            compare "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt" >> "$RUNNER_TEMP/changes.txt"
          done

          major() { local v=${1#v}; echo "${v%%.*}"; }
          majors=()
          while read -r name old new; do
            if [[ "$old" != "-" && "$new" != "-" && "$(major "$old")" != "$(major "$new")" ]]; then
              majors+=("$name $old -> $new")
            fi
          done < "$RUNNER_TEMP/changes.txt"
          if [[ ${#majors[@]} -gt 0 ]]; then
            problem "The fix needs a major version change, which needs a human to apply and test: ${majors[*]}"
          fi

          # Go directive and toolchain changes (a standard library fix bumps the go directive)
          directives='{}'
          if [[ -f go.mod ]]; then
            for d in go toolchain; do
              old=$(git show "$BASE_SHA:go.mod" | awk -v d="$d" '$1 == d {print $2}')
              new=$(awk -v d="$d" '$1 == d {print $2}' go.mod)
              if [[ "$old" != "$new" ]]; then
                directives=$(jq -c --arg d "$d" --arg o "${old:--}" --arg n "${new:--}" '. + {($d): {old: $o, new: $n}}' <<< "$directives")
              fi
            done
          fi

          jq -Rn --argjson directives "$directives" \
            '{directives: $directives, bumps: [inputs | split(" ") | {name: .[0], old: .[1], new: .[2]}]}' \
            < "$RUNNER_TEMP/changes.txt" > "$RUNNER_TEMP/changes.json"

          # Old to new per vulnerability, and the side effects beyond the targeted bumps
          jq -r --slurpfile ch "$RUNNER_TEMP/changes.json" '
            .[] | . as $v
            | (if $v.package == "stdlib" then "go \($ch[0].directives.go.old // "?") -> \($ch[0].directives.go.new // "?")"
               else ([$ch[0].bumps[] | select(.name == $v.package or (.name | endswith("node_modules/" + $v.package))) | "\(.old) -> \(.new)"]
                     | unique | join(", ")) end) as $change
            | "- [\($v.severity | ascii_upcase)] \($v.ids | join(", ")) `\($v.package)`: \(if $change == "" then "to " + $v.fixed else $change end)"
          ' "$RUNNER_TEMP/actionable.json" > "$RUNNER_TEMP/summary.md"

          jq -r --slurpfile vulns "$RUNNER_TEMP/actionable.json" --argjson files "$(printf '%s\n' "${files[@]}" | jq -R . | jq -sc .)" '
            ([.bumps[] | select(. as $b | $vulns[0] | any(. as $v | $v.package == $b.name or ($b.name | endswith("node_modules/" + $v.package))) | not)]) as $other
            | [ (.directives | to_entries[] | "- `\(.key)` directive changed: \(.value.old) -> \(.value.new)"),
                (if ($other | length) > 0 then "- \($other | length) other dependency version(s) changed (indirect or transitive):" else empty end),
                ($other[:15][] | "  - `\(.name)`: \(.old) -> \(.new)"),
                (if ($other | length) > 15 then "  - ... and \($other | length - 15) more" else empty end),
                "- Files changed: \($files | map("`" + . + "`") | join(", "))" ]
            | .[]
          ' "$RUNNER_TEMP/changes.json" > "$RUNNER_TEMP/side-effects.md"

          echo "has-diff=true" >> "$GITHUB_OUTPUT"

      - name: Verify the fixed versions are reached
        id: verify
        if: steps.guard.outputs.has-diff == 'true'
        env:
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
          GOPRIVATE: ${{ inputs.go-private }}
          GIT_CONFIG_COUNT: ${{ secrets.GO_PRIVATE_MODULES_TOKEN != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GO_PRIVATE_MODULES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          problem() {
            echo "$1" >> "$RUNNER_TEMP/problems.txt"
            echo "::warning::$1"
          }
          # ver_ge A B: version A is at least version B
          ver_ge() { [[ "$(printf '%s\n%s\n' "${2#v}" "${1#v}" | sort -V | head -n1)" == "${2#v}" ]]; }
          major() { local v=${1#v}; echo "${v%%.*}"; }

          unmet=()
          while IFS=$'\t' read -r eco pkg fixed; do
            case "$eco" in
              go)
                cur=$(go list -m -f '{{.Version}}' "$pkg" 2>/dev/null || true)
                # A version that cannot be read is not proof of a fix (Dependabot can name a package path
                # that is not a module path), so it is reported instead of passed
                if [[ -z "$cur" ]]; then
                  unmet+=("the version of $pkg could not be read, needs $fixed")
                elif ! ver_ge "$cur" "$fixed"; then
                  unmet+=("$pkg is $cur, needs $fixed")
                fi
                ;;
              go-stdlib)
                directive=$(go mod edit -json | jq -r '.Go // ""')
                toolchain=$(go mod edit -json | jq -r '(.Toolchain // "") | ltrimstr("go")')
                ver_ge "${directive:-0}" "$fixed" || ver_ge "${toolchain:-0}" "$fixed" || unmet+=("go directive is ${directive:-unset}, needs $fixed")
                ;;
              npm)
                # Copies of the package on another major version are not what the advisory fix targets
                while read -r cur; do
                  if [[ "$(major "$cur")" == "$(major "$fixed")" ]] && ! ver_ge "$cur" "$fixed"; then
                    unmet+=("$pkg is $cur, needs $fixed")
                  fi
                done < <(jq -r --arg p "$pkg" '(.packages // {}) | to_entries[] | select(.key == "node_modules/" + $p or (.key | endswith("/node_modules/" + $p))) | .value.version' package-lock.json)
                ;;
            esac
          done < <(jq -r '.[] | [.ecosystem, .package, .fixed] | @tsv' "$RUNNER_TEMP/actionable.json")
          if [[ ${#unmet[@]} -gt 0 ]]; then
            problem "After the change the fixed versions are not reached: ${unmet[*]}"
          fi

          # A Dockerfile that builds with an older Go image than the new go directive fails to build, and that
          # build may only run at deployment. Dockerfiles are not changed here, so a human has to bump them.
          new_go=$(jq -r '.directives.go.new // empty' "$RUNNER_TEMP/changes.json")
          if [[ -n "$new_go" && "$new_go" != "-" ]]; then
            old_images=()
            while IFS=: read -r file tag; do
              # A tag without a patch version (golang:1.27) follows the newest patch release: compare major.minor
              want=$new_go
              [[ "$tag" =~ ^[0-9]+\.[0-9]+$ ]] && want=$(cut -d. -f1,2 <<< "$new_go")
              ver_ge "$tag" "$want" || old_images+=("$file uses golang:$tag")
            done < <(git ls-files -z | grep -zE '(^|/)[^/]*Dockerfile[^/]*$' \
                       | xargs -0 -r grep -HoE 'golang:[0-9]+\.[0-9]+(\.[0-9]+)?' | sed -E 's/:golang:/:/' | sort -u)
            if [[ ${#old_images[@]} -gt 0 ]]; then
              problem "The go directive is now $new_go, but a Dockerfile builds with an older Go image and needs the same bump: ${old_images[*]}"
            fi
          fi

          # The Go code must still build. Nothing from npm is installed or run here: that would run code from the
          # bumped packages in this job. The pull request's own checks build and test.
          build_ok=true
          if [[ -f go.mod ]] && ! go build ./... > "$RUNNER_TEMP/build.log" 2>&1; then
            build_ok=false
            problem "go build fails after the change: $(tail -n 3 "$RUNNER_TEMP/build.log" | tr '\n' ' ')"
          fi

          # Dependabot alerts only clear after the merge, so govulncheck is what can be re-run here
          if [[ -f go.mod && "$build_ok" == "true" ]]; then
            if govulncheck -format json ./... > "$RUNNER_TEMP/govulncheck-after.json"; then
              remaining=$(jq -n --slurpfile alerts <(echo '[]') --slurpfile govulncheck "$RUNNER_TEMP/govulncheck-after.json" \
                --argjson ecosystems '["go"]' -f "$RUNNER_TEMP/gate.jq" | jq -r 'map(.ids[0] + " (" + .package + ")") | join(", ")')
              if [[ -n "$remaining" ]]; then
                problem "govulncheck still reports fixable vulnerabilities after the change: $remaining"
              fi
            else
              problem "govulncheck could not run after the change."
            fi
          fi

      # ---- Step D: pull request and auto-merge ----------------------------------------------------------------

      # Created only now, after the bump and the checks have finished
      - name: Create the GitHub App token
        id: app-token
        if: steps.guard.outputs.has-diff == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOFIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PEM }}

      - name: Open pull request
        id: pr
        if: steps.guard.outputs.has-diff == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          TOP_SEVERITY: ${{ steps.gate.outputs.top-severity }}
          LABELS: ${{ inputs.pr-labels }}
          NEEDS_HUMAN_LABEL: ${{ inputs.needs-human-label }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Any recorded problem means a human has to finish the job: draft pull request, no auto-merge
          needs_human=false
          [[ -s "$RUNNER_TEMP/problems.txt" ]] && needs_human=true

          count=$(jq length "$RUNNER_TEMP/actionable.json")
          if [[ "$count" -le 3 ]]; then
            title="fix(deps): fix security vulnerabilities ($(jq -r 'map(.ids[0]) | join(", ")' "$RUNNER_TEMP/actionable.json"))"
          else
            title="fix(deps): fix $count security vulnerabilities"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "$title" -m "Automated by the vulnerability autofix workflow: $RUN_URL"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # The branch is replaced, unless it already holds exactly these files (then its checks do not run again)
          if [[ "$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .commit.tree.sha 2>/dev/null || true)" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push -q --force "${GITHUB_SERVER_URL}/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          fi

          {
            if [[ "$needs_human" == "true" ]]; then
              echo "## First-pass security fix: needs a human"
              echo
              echo "This is a draft. A guard failed, so auto-merge is NOT enabled. Resolve the problems below, then mark it ready for review and merge it."
              echo
              echo "### Guards that failed, and what remains"
              sed 's/^/- /' "$RUNNER_TEMP/problems.txt"
            else
              echo "## Security fix (automated)"
            fi
            echo
            echo "Highest severity: **$TOP_SEVERITY**"
            echo
            echo "### Vulnerabilities targeted"
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "### How it was addressed"
            if [[ "$needs_human" == "true" ]]; then
              echo "The packages above were bumped to the minimum published fixed version as a first pass. See the failed guards above for what is incomplete."
            else
              echo "Only the packages above were bumped, each to the minimum published fixed version. Deterministic guards confirmed that only dependency files changed, that no major version changed, that the fixed versions are reached and that the code builds. Tests run in this pull request's CI."
            fi
            echo
            echo "### Side effects"
            cat "$RUNNER_TEMP/side-effects.md"
            echo
            echo "### Deployment"
            echo "Merging this does not deploy it. The fix reaches production with the next deployment."
            echo
            echo "Workflow run: $RUN_URL"
          } > "$RUNNER_TEMP/pr-body.md"

          all_labels="$LABELS"
          draft=()
          if [[ "$needs_human" == "true" ]]; then
            all_labels="${all_labels:+$all_labels,}$NEEDS_HUMAN_LABEL"
            draft=(--draft)
          fi
          IFS=',' read -ra labels <<< "$all_labels"
          for l in "${labels[@]}"; do
            gh label create "$l" --repo "$REPO" > /dev/null 2>&1 || true
          done
          pr_url=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -n "$pr_url" ]]; then
            # Already reported when it was opened, so Slack is not posted again
            gh pr edit "$pr_url" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            pr_url=$(gh pr create --repo "$REPO" --base "$BASE_BRANCH" --head "$BRANCH" --title "$title" \
              --body-file "$RUNNER_TEMP/pr-body.md" --label "$all_labels" "${draft[@]}" | tail -n1)
            {
              echo "pr-url=$pr_url"
              echo "needs-human=$needs_human"
            } >> "$GITHUB_OUTPUT"
          fi

          # Nothing that failed a guard is ever auto-merged
          if [[ "$needs_human" == "true" ]]; then
            status="auto-merge is NOT enabled: this is a draft first-pass fix that needs a human"
          elif [[ "$AUTO_MERGE" == "true" ]]; then
            if err=$(gh pr merge "$pr_url" --auto --squash 2>&1); then
              status="auto-merge enabled: it merges once the required checks pass"
            else
              status="auto-merge could not be enabled ($(head -n1 <<< "$err")): a human needs to merge it"
            fi
          else
            status="auto-merge is off: a human needs to merge it"
          fi
          echo "$status" > "$RUNNER_TEMP/merge-status.txt"

      # ---- Step E: Slack ---------------------------------------------------------------------------------------

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-channel-id || secrets.SLACK_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          PR_URL: ${{ steps.pr.outputs.pr-url }}
          NEEDS_HUMAN: ${{ steps.pr.outputs.needs-human }}
          TOP_SEVERITY: ${{ steps.gate.outputs.top-severity }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          read_file() { [[ -f "$RUNNER_TEMP/$1" ]] && cat "$RUNNER_TEMP/$1" || true; }

          if [[ -n "$PR_URL" && "$NEEDS_HUMAN" == "true" ]]; then
            case "$TOP_SEVERITY" in
              critical) header=":rotating_light: *CRITICAL vulnerability: first-pass fix opened, more work needed* in *${REPO}*" ;;
              high) header=":rotating_light: *HIGH severity vulnerability: first-pass fix opened, more work needed* in *${REPO}*" ;;
              *) header=":construction: *Security first-pass fix opened, more work needed* in *${REPO}*" ;;
            esac
            text="${header}"$'\n\n'"*What still needs a human*"$'\n'"$(sed 's/^/- /' "$RUNNER_TEMP/problems.txt")"$'\n\n'"*Vulnerabilities*"$'\n'"$(read_file summary.md)"$'\n\n'"*Draft pull request:* ${PR_URL}"$'\n'"*Merge status:* $(read_file merge-status.txt)"$'\n'"*Needs deployment to reach production* once a human finishes and merges it."$'\n\n'"*Side effects*"$'\n'"$(read_file side-effects.md)"$'\n\n'"Run: ${RUN_URL}"
          elif [[ -n "$PR_URL" ]]; then
            case "$TOP_SEVERITY" in
              critical) header=":rotating_light: *CRITICAL vulnerability: fix pull request opened* in *${REPO}*" ;;
              high) header=":rotating_light: *HIGH severity vulnerability: fix pull request opened* in *${REPO}*" ;;
              *) header=":lock: Security fix pull request opened for *${REPO}*" ;;
            esac
            text="${header}"$'\n\n'"*Vulnerabilities*"$'\n'"$(read_file summary.md)"$'\n\n'"*Pull request:* ${PR_URL}"$'\n'"*Merge status:* $(read_file merge-status.txt)"$'\n'"*Not fixed until it is merged and deployed.* Merging does not deploy it."$'\n\n'"*Side effects*"$'\n'"$(read_file side-effects.md)"$'\n\n'"Run: ${RUN_URL}"
          elif [[ -s "$RUNNER_TEMP/problems.txt" ]]; then
            text=":sos: *Vulnerability autofix needs a human* in *${REPO}*. A fix is published but no pull request was opened."$'\n\n'"*Reason:*"$'\n'"$(sed 's/^/- /' "$RUNNER_TEMP/problems.txt")"$'\n\n'"*Fixable vulnerabilities still open*"$'\n'"$(read_file targets.md)"$'\n\n'"Run: ${RUN_URL}"
          elif [[ "$JOB_STATUS" == "failure" ]]; then
            text=":x: *Vulnerability autofix failed* in *${REPO}* before it could finish, so fixable vulnerabilities may be open. Check the run: ${RUN_URL}"
          else
            echo "Nothing was done, so there is nothing to report."
            exit 0
          fi

          payload=$(jq -n --arg channel "$CHANNEL" --arg text "$text" '{channel: $channel, text: $text, unfurl_links: false}')
          response=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-type: application/json; charset=utf-8" --data "$payload")
          if [[ "$(jq -r '.ok' <<< "$response")" != "true" ]]; then
            echo "::error::Slack post failed: $(jq -r '.error // "unknown error"' <<< "$response")"
            exit 1
          fi
