# This Continuous Integration (CI) workflow template can be used in repositories that contain OpenTofu (or Terraform) code.
#
# The following jobs are included:
#  * terraform-docs: Formats changed files with tofu fmt, generates documentation
#    for modules (directories without a backend or cloud block), and pushes changes
#  * tflint: Runs TFLint on changed Terraform files
#  * checkov-scan: Runs Checkov security scanning on changed Terraform files
#  * environment-consistency: Reports when a component's environment folders
#    (1-dev, 2-tst, 4-prd, ...) hold different code, in the job summary and in
#    a pull request comment it updates on each run. With
#    environment_consistency: warn (the default) the job passes; with fail it
#    fails. A future major release will make fail the default. Every folder of a
#    component must hold the same code, so a change applied in the first
#    environment is the change that reaches production. Per-environment values
#    come from Scalr workspace variables, and a resource only some
#    environments need sits behind a variable that turns it on.
#
#    It compares each environment folder with the one before it in promotion
#    order (1-dev with 2-tst, 2-tst with 4-prd), file by file at any depth. Only
#    OpenTofu files are compared (environment_include_files). These differences
#    are allowed:
#     - Quoted values inside the cloud or backend block of the terraform block
#       and inside scalr_outputs data sources, in any file: the Scalr workspace,
#       organization and environment.
#     - import, moved and removed blocks, with the comment lines directly above
#       them. Import IDs differ per environment, and the blocks are deleted once
#       every environment has applied them. A file left with nothing else in it
#       counts as absent.
#     - Blank lines. Every other comment is compared like code.
#     - Files matching environment_ignore_files.
#    It checks the whole repository, not only the folders a pull request
#    changed. A module repository has no environment folders and passes.
#
# NOTE: Certain inputs are required, as detailed in the "inputs" section below.

name: Terraform CI (Reusable)

permissions: {}

on:
  workflow_call:
    inputs:
      output_file:
        description: Output file for generated docs
        required: false
        type: string
        default: README.md
      output_method:
        description: Method to apply the generated docs (e.g., replace, inject)
        required: false
        type: string
        default: replace
      git_push:
        description: Whether to push changes back to the PR
        required: false
        type: boolean
        default: true
      tofu_version:
        description: 'OpenTofu version used to format files'
        required: false
        type: string
        default: '1.13.9' # renovate: datasource=github-releases depName=opentofu/opentofu
      terraform_version:
        description: '(Deprecated) Ignored. Files are formatted with OpenTofu at tofu_version. Remove this input; a future major release will drop it'
        required: false
        type: string
        default: ''
      output_format:
        description: 'Output format for Checkov results (e.g., cli or cli,sarif)'
        required: false
        type: string
        default: 'cli'
      output_file_path:
        description: 'Output file path for Checkov results (e.g., console or console,results.sarif)'
        required: false
        type: string
        default: 'console'
      upload_sarif:
        description: 'Enable or disable SARIF file upload for Checkov and TFLint (true/false)'
        required: false
        type: boolean
        default: false
      skip_check:
        description: 'Comma-separated list of checks to skip (e.g., CKV_TF_1,CKV_GCP_18)'
        required: false
        type: string
        default: ''
      environment_consistency:
        description: 'What the environment-consistency job does when environment folders differ: warn (report, comment on the pull request and pass), fail (also fail the job) or off (skip the job)'
        required: false
        type: string
        default: 'warn'
      environment_working_directory:
        description: 'Directory the environment-consistency job searches for environment folders'
        required: false
        type: string
        default: '.'
      environment_codes:
        description: 'Comma-separated environment codes. Folders named <number>-<code> are compared; others, such as 0-bootstrap or 3-shr, are left out and listed in the job summary'
        required: false
        type: string
        default: 'dev,int,tst,uat,stg,prd'
      environment_include_files:
        description: 'Comma-separated glob patterns, matched against file names at any depth, of the files the environment comparison covers'
        required: false
        type: string
        default: '*.tf,*.tf.json,.terraform.lock.hcl'
      environment_ignore_files:
        description: 'Comma-separated glob patterns, matched against file names at any depth, left out of the environment comparison'
        required: false
        type: string
        default: ''
    secrets:
      app_client_id:
        description: GitHub App Client ID for authentication
        required: false
      app_id:
        description: '[DEPRECATED] Use app_client_id. Kept for backward compatibility.'
        required: false
      app_pem:
        description: GitHub App private key for authentication
        required: true

jobs:
  terraform-docs:
    name: Format and document Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check for Terraform file changes
        id: check-changes
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRTUXB origin/${{ github.base_ref }}...HEAD | grep -E '\.tf$|\.tfvars$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No .tf or .tfvars files changed. Skipping terraform-docs."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: No Terraform changes detected
        if: steps.check-changes.outputs.has_changes != 'true'
        run: |
          echo "No Terraform files changed. Passing check."
          exit 0

      - name: Generate GitHub App Token
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.app_client_id || secrets.app_id }}
          private-key: ${{ secrets.app_pem }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check-changes.outputs.has_changes == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Warn about deprecated terraform_version input
        if: inputs.terraform_version != ''
        run: |
          echo "::warning::terraform_version is deprecated and ignored. Files are formatted with OpenTofu ${TOFU_VERSION}. Remove terraform_version from the call to terraform-ci.yml, and set tofu_version to pick another OpenTofu version."
        env:
          TOFU_VERSION: ${{ inputs.tofu_version }}

      - name: Set up OpenTofu
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tofu_wrapper: false

      - name: Find changed Terraform directories
        if: steps.check-changes.outputs.has_changes == 'true'
        id: changed-files
        run: |
          # Get changed .tf and .tfvars files
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRTUXB origin/${{ github.base_ref }}...HEAD | grep -E '\.tf$|\.tfvars$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No .tf or .tfvars files changed. Skipping format check."
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "dirs=" >> $GITHUB_OUTPUT
          else
            # Get unique directories of changed files
            CHANGED_DIRS=$(echo "$CHANGED_FILES" | xargs -n 1 dirname | sort -u | tr '\n' ' ' | sed 's/ $//')
            echo "Changed Terraform directories: $CHANGED_DIRS"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "dirs=$CHANGED_DIRS" >> $GITHUB_OUTPUT

            # Docs are for modules. A directory that declares a backend or
            # cloud block is a root configuration: nothing calls it, so it
            # gets no generated README. Root configurations can also use
            # OpenTofu-only syntax (such as provider for_each) that
            # terraform-docs can't parse.
            # terraform-docs/gh-actions takes a comma-separated working-dir.
            DOCS_DIRS=""
            for DIR in $CHANGED_DIRS; do
              [ -d "$DIR" ] || continue
              if grep -qsE '^[[:space:]]*(backend[[:space:]]+"|cloud[[:space:]]*\{)' "$DIR"/*.tf; then
                echo "Skipping docs for $DIR: root configuration"
              else
                DOCS_DIRS="${DOCS_DIRS:+$DOCS_DIRS,}$DIR"
              fi
            done
            echo "docs_dirs=$DOCS_DIRS" >> "$GITHUB_OUTPUT"
          fi

      - name: Format files
        if: steps.check-changes.outputs.has_changes == 'true' && steps.changed-files.outputs.changed == 'true'
        run: |
          #!/bin/bash
          set -e
          if ! command -v tofu &> /dev/null; then
            echo "Error: OpenTofu is not installed."
            exit 1
          fi
          DIRS="${{ steps.changed-files.outputs.dirs }}"
          if [ -z "$DIRS" ]; then
            echo "No directories to check. Skipping."
            exit 0
          fi
          IFS=' ' read -ra DIR_ARRAY <<< "$DIRS"
          for DIR in "${DIR_ARRAY[@]}"; do
            if [ -d "$DIR" ]; then
              echo "Formatting files in $DIR..."
              tofu fmt -recursive "$DIR"
            fi
          done
          echo "Files formatted."

      - name: Commit and push formatted files
        if: steps.check-changes.outputs.has_changes == 'true' && steps.changed-files.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-format Terraform files" || echo "No changes to commit"
          git push

      - name: Render Terraform docs and push changes
        if: steps.check-changes.outputs.has_changes == 'true' && steps.changed-files.outputs.docs_dirs != ''
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ steps.changed-files.outputs.docs_dirs }}
          output-file: ${{ inputs.output_file }}
          output-method: ${{ inputs.output_method }}
          git-push: ${{ inputs.git_push }}
          git-push-user-name: github-actions[bot]
          git-push-user-email: github-actions[bot]@users.noreply.github.com

  detect-changed-dirs:
    name: Detect Changed Terraform Directories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed directories
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD | grep -E '\.tf$|\.tfvars$' || true)
          else
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD | grep -E '\.tf$|\.tfvars$' || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "dirs=[]" >> $GITHUB_OUTPUT
          else
            # Get unique directories of changed files
            CHANGED_DIRS=$(echo "$CHANGED_FILES" | xargs -n 1 dirname | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "dirs=$CHANGED_DIRS" >> $GITHUB_OUTPUT
            echo "Changed directories: $CHANGED_DIRS"
          fi

  tflint:
    name: Run TFLint on Changed Files
    runs-on: ubuntu-latest
    needs: [terraform-docs, detect-changed-dirs]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: No Terraform changes detected
        if: needs.detect-changed-dirs.outputs.has_changes != 'true'
        run: |
          echo "No Terraform files changed. Skipping TFLint."
          exit 0

      - name: Checkout code
        if: needs.detect-changed-dirs.outputs.has_changes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up TFLint
        if: needs.detect-changed-dirs.outputs.has_changes == 'true'
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: latest

      - name: Run TFLint on all changed directories
        if: needs.detect-changed-dirs.outputs.has_changes == 'true'
        run: |
          #!/bin/bash
          set -e
          DIRS='${{ needs.detect-changed-dirs.outputs.dirs }}'
          UPLOAD_SARIF='${{ inputs.upload_sarif }}'

          if [ "$UPLOAD_SARIF" = "true" ]; then
            mkdir -p /tmp/sarif
          fi

          echo "$DIRS" | jq -r '.[]' | while read DIR; do
            if [ -z "$DIR" ]; then
              continue
            fi
            echo "Running TFLint in $DIR..."
            cd "$GITHUB_WORKSPACE/$DIR"
            tflint --init
            if [ "$UPLOAD_SARIF" = "true" ]; then
              tflint --format=sarif --minimum-failure-severity=error > /tmp/sarif/tflint-${DIR//\//-}.sarif || true
            else
              tflint --minimum-failure-severity=error
            fi
          done

      - name: Upload TFLint SARIF file
        if: needs.detect-changed-dirs.outputs.has_changes == 'true' && inputs.upload_sarif == true && hashFiles('/tmp/sarif/tflint-*.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: /tmp/sarif/tflint-*.sarif
          category: tflint
          wait-for-processing: true

  checkov-scan:
    name: Run Checkov Scan on Changed Files
    runs-on: ubuntu-latest
    needs: [terraform-docs, detect-changed-dirs]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Identify changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD > changed_files.txt || true
          else
            git diff --name-only --diff-filter=ACMR HEAD^ HEAD > changed_files.txt || true
          fi
          if [ -s changed_files.txt ]; then
            CHANGED_FILES=$(paste -sd ' ' changed_files.txt)
            echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkov GitHub Action
        if: steps.changed-files.outputs.has_files == 'true'
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          file: ${{ steps.changed-files.outputs.files }}
          output_format: ${{ inputs.upload_sarif == true && 'cli,sarif' || inputs.output_format }}
          output_file_path: ${{ inputs.upload_sarif == true && 'console,results.sarif' || inputs.output_file_path }}
          quiet: true
          skip_check: ${{ inputs.skip_check }}

      - name: Upload SARIF file
        if: inputs.upload_sarif == true && steps.changed-files.outputs.has_files == 'true' && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: checkov

  environment-consistency:
    name: Check environment folders match
    runs-on: ubuntu-latest
    if: inputs.environment_consistency != 'off'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare environment folders
        id: compare
        env:
          MODE: ${{ inputs.environment_consistency }}
          WORKING_DIRECTORY: ${{ inputs.environment_working_directory }}
          ENVIRONMENTS: ${{ inputs.environment_codes }}
          INCLUDE_FILES: ${{ inputs.environment_include_files }}
          IGNORE_FILES: ${{ inputs.environment_ignore_files }}
        run: |
          set -euo pipefail

          if [[ $MODE != warn && $MODE != fail ]]; then
            echo "::error::environment_consistency must be warn, fail or off, not '$MODE'."
            exit 1
          fi
          level=warning
          [[ $MODE == warn ]] || level=error

          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # The file list for the pull request comment.
          findings="${RUNNER_TEMP:?}/environment-consistency.md"
          : > "$findings"
          env_codes="${ENVIRONMENTS//[[:space:]]/}"
          env_regex="(^|/)[0-9]+-(${env_codes//,/|})$"
          IFS=, read -ra include_patterns <<< "${INCLUDE_FILES//[[:space:]]/}"
          IFS=, read -ra ignore_patterns <<< "${IGNORE_FILES//[[:space:]]/}"
          differences=0

          # Whether a file name matches one of the glob patterns that follow it.
          matches_any() {
            local name=${1##*/} pattern
            shift
            for pattern in "$@"; do
              # shellcheck disable=SC2053 # the pattern is a glob on purpose
              [[ -n $pattern && $name == $pattern ]] && return 0
            done
            return 1
          }

          # A file's content, with what may differ removed: the quoted strings
          # inside a cloud or backend block of the terraform block and inside a
          # scalr_outputs data source, import, moved and removed blocks with the
          # comment lines directly above them, and blank lines. Other comments
          # stay. tofu fmt starts and ends top-level blocks in the first column.
          normalized() {
            local dir=$1 file=$2
            awk '
              # Braces opened minus braces closed, outside strings and comments.
              function depth_change(text) {
                gsub(/"([^"\\]|\\.)*"/, "", text)
                sub(/(#|\/\/).*/, "", text)
                return gsub(/\{/, "{", text) - gsub(/\}/, "}", text)
              }
              function mask(text) {
                gsub(/"([^"\\]|\\.)*"/, "\"<per-environment>\"", text)
                return text
              }
              {
                line = $0
                if (masking) {
                  line = mask(line)
                } else if ((depth == 0 && /^data[[:space:]]+"scalr_outputs"[[:space:]]+"[^"]*"[[:space:]]*\{/) ||
                    (in_terraform && depth == 1 && /^[[:space:]]*(cloud|backend[[:space:]]+"[^"]*")[[:space:]]*\{/)) {
                  # Keep the block header, so a changed backend type still shows.
                  open = index(line, "{")
                  line = substr(line, 1, open) mask(substr(line, open + 1))
                  masking = 1
                  masked_depth = depth
                }
                if (depth == 0 && /^terraform[[:space:]]*\{/) in_terraform = 1
                depth += depth_change($0)
                if (depth == 0) in_terraform = 0
                if (masking && depth <= masked_depth) masking = 0
                print line
              }
            ' "$dir/$file" | awk '
              skip { if (/^}/) skip = 0; next }
              /^[[:space:]]*(#|\/\/)/ { held = held $0 "\n"; next }
              /^(import|moved|removed)[[:space:]]*\{/ { held = ""; if (!/}[[:space:]]*$/) skip = 1; next }
              { printf "%s", held; held = "" }
              NF == 0 { next }
              { print }
              END { printf "%s", held }
            '
          }

          # Compared files under an environment folder, relative to it, sorted.
          # A file with nothing left after normalizing counts as absent.
          tracked_files() {
            git -C "$1" ls-files | while IFS= read -r file; do
              matches_any "$file" "${include_patterns[@]}" || continue
              ! matches_any "$file" "${ignore_patterns[@]}" || continue
              [[ -n $(normalized "$1" "$file") ]] || continue
              printf '%s\n' "$file"
            done | LC_ALL=C sort
          }

          report() {
            local file=$1 message=$2 detail=${3:-}
            differences=$((differences + 1))
            echo "::$level file=$file::$message"
            echo "- \`$file\`: $message" >> "$findings"
            {
              echo "- \`$file\`: $message"
              if [[ -n $detail ]]; then
                echo
                echo '```diff'
                printf '%s\n' "$detail"
                echo '```'
                echo
              fi
            } >> "$summary"
            [[ -z $detail ]] || printf '%s\n' "$detail"
          }

          compare() {
            local base=$1 other=$2 file diff_output
            local base_files other_files
            base_files=$(tracked_files "$base")
            other_files=$(tracked_files "$other")

            while IFS= read -r file; do
              [[ -n $file ]] || continue
              report "$other/$file" "not in $base"
            done < <(comm -13 <(echo "$base_files") <(echo "$other_files"))

            while IFS= read -r file; do
              [[ -n $file ]] || continue
              report "$base/$file" "missing from $other"
            done < <(comm -23 <(echo "$base_files") <(echo "$other_files"))

            while IFS= read -r file; do
              [[ -n $file ]] || continue
              if ! diff_output=$(diff -u --label "$base/$file" --label "$other/$file" \
                  <(normalized "$base" "$file") <(normalized "$other" "$file")); then
                report "$other/$file" "differs from $base/$file" "$diff_output"
              fi
            done < <(comm -12 <(echo "$base_files") <(echo "$other_files"))
          }

          mapfile -t numbered_dirs < <(
            find "$WORKING_DIRECTORY" \( -name .git -o -name .terraform \) -prune -o -type d -print \
              | grep -E '(^|/)[0-9]+-[^/]+$' | sed 's|^\./||' | sort -V
          )
          mapfile -t env_dirs < <(printf '%s\n' "${numbered_dirs[@]}" | grep -E "$env_regex" || true)
          mapfile -t skipped_dirs < <(printf '%s\n' "${numbered_dirs[@]}" | grep -vE "$env_regex" || true)

          declare -A components=()
          component_names=()
          for dir in "${env_dirs[@]}"; do
            [[ -n $dir ]] || continue
            components[$(dirname "$dir")]+="$dir"$'\n'
          done

          echo "## Environment folder consistency" >> "$summary"
          compared=0
          mapfile -t component_names < <(printf '%s\n' "${!components[@]}" | sort)
          for component in "${component_names[@]}"; do
            [[ -n $component ]] || continue
            mapfile -t dirs < <(printf '%s' "${components[$component]}" | sort -V)
            (( ${#dirs[@]} > 1 )) || continue
            compared=$((compared + 1))
            echo "Comparing ${dirs[*]}"
            echo "### \`$component\`: ${dirs[*]##*/}" >> "$summary"
            for (( i = 1; i < ${#dirs[@]}; i++ )); do
              compare "${dirs[i-1]}" "${dirs[i]}"
            done
          done

          if (( ${#skipped_dirs[@]} > 0 )) && [[ -n ${skipped_dirs[0]} ]]; then
            {
              echo
              echo "Left out, because their codes aren't in \`environment_codes\`: ${skipped_dirs[*]}"
            } | tee -a "$summary"
          fi

          echo "differences=$differences" >> "${GITHUB_OUTPUT:-/dev/null}"

          if (( compared == 0 )); then
            echo "No component has more than one folder matching $env_regex, so there is nothing to compare. A module repository has none." | tee -a "$summary"
          elif (( differences > 0 )); then
            {
              echo
              echo "$differences difference(s). Move each one into a Scalr workspace variable,"
              echo "or behind a variable that turns the resource on, so every folder holds the same code."
            } | tee -a "$summary"
            if [[ $MODE == fail ]]; then
              exit 1
            fi
            echo "environment_consistency is warn, so the job passes." | tee -a "$summary"
          else
            echo "All $compared component(s) match." | tee -a "$summary"
          fi

      # One comment per pull request, found by its marker and edited on each
      # run. A pull request from a fork gets a read-only token, so a failure to
      # comment doesn't fail the job.
      - name: Comment on the pull request
        if: >-
          !cancelled() && github.event_name == 'pull_request'
          && steps.compare.outputs.differences != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.environment_consistency }}
          DIFFERENCES: ${{ steps.compare.outputs.differences }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          marker='<!-- cccteam/github-workflows: environment-consistency -->'
          findings="$RUNNER_TEMP/environment-consistency.md"
          body="$RUNNER_TEMP/environment-consistency-comment.md"
          max_listed=50

          comment_id=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)

          if (( DIFFERENCES == 0 )); then
            if [[ -z $comment_id ]]; then
              echo "Environment folders match, and there is no earlier comment to update."
              exit 0
            fi
            {
              echo "$marker"
              echo "### Environment folders match"
              echo
              echo "The differences reported here earlier are fixed. Every environment folder holds the same code."
            } > "$body"
          else
            {
              echo "$marker"
              echo "### Environment folders don't match"
              echo
              echo "This repository has $DIFFERENCES difference(s) between environment folders that should hold the same code. The check covers the whole repository, so some may be older than this pull request. The [job summary]($RUN_URL) shows each diff."
              echo
              head -n "$max_listed" "$findings"
              listed=$(wc -l < "$findings")
              if (( listed > max_listed )); then
                echo "- ...and $((listed - max_listed)) more in the job summary."
              fi
              echo
              echo "Every environment folder of a component should hold the same code, comments included. Put values that differ between environments in Scalr workspace variables, and put a resource that only some environments need behind a variable that turns it on."
              echo
              if [[ $MODE == fail ]]; then
                echo "This repository enforces the check, so the pull request can't pass until the folders match."
              else
                echo "For now this check only warns. A future release of \`cccteam/github-workflows\` will make it fail, so please fix these before then. Once the folders match, set \`environment_consistency: fail\` where this repository calls \`terraform-ci.yml\` to enforce it now."
              fi
            } > "$body"
          fi

          if [[ -n $comment_id ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -F "body=@$body" > /dev/null
            echo "Updated comment $comment_id."
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$body" > /dev/null
            echo "Added a comment."
          fi
