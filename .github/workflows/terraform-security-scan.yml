# This workflow performs continuous Checkov security scanning of the entire Terraform codebase.
# It runs on a weekly schedule against the default branch and uploads results to GitHub Code Scanning.
#
# Checkov check skips should be configured in the calling repository's .checkov.yaml file or inline where applicable.

name: Terraform Security Scan (Reusable)

permissions: {}

on:
  workflow_call:
    inputs:
      schedule:
        description: 'Cron expression for the scan schedule. Defaults to weekly on Monday at midnight UTC.'
        required: false
        type: string
        default: '0 0 * * 1'
  workflow_dispatch:

jobs:
  tflint-full-scan:
    name: TFLint Full Repository Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format=sarif --minimum-failure-severity=warning > tflint-results.sarif || true

      - name: Filter TFLint SARIF results missing locations
        if: hashFiles('tflint-results.sarif') != ''
        run: |
          jq 'del(.runs[].results[] | select((.locations == null) or (.locations | length == 0)))' \
            tflint-results.sarif > tflint-filtered.sarif

      - name: Upload TFLint SARIF file
        if: hashFiles('tflint-filtered.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: tflint-filtered.sarif
          category: tflint

  checkov-full-scan:
    name: Checkov Full Repository Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@a7683e7b72a04503521247973281ec8142e1ac1f # v12.3112.0
        with:
          directory: .
          output_format: cli,sarif
          output_file_path: console,results.sarif
          quiet: true
          soft_fail: true

      - name: Upload SARIF file
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
          category: checkov
